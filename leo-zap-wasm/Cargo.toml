[package]
name = "leo-zap-wasm"
version = "0.1.0"
edition = "2021"
description = "WebAssembly bindings for the LeoZap fuzzer engine"

[lib]
crate-type = ["cdylib"]

[dependencies]
leo-zap-core = { path = "../leo-zap-core" }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
js-sys = "0.3"
getrandom = { version = "0.2", features = ["js"] }
