[package]
name = "leo-zap-core"
version = "0.1.0"
edition = "2021"
description = "Core fuzzer engine for Aleo Leo contracts — parser, generator, symbolic executor, invariants"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
toml = "0.8"
thiserror = "1"

[dev-dependencies]
pretty_assertions = "1"
