[package]
name = "leo-zap"
version = "0.1.0"
edition = "2021"
description = "Property-based fuzzer + privacy invariant checker for Aleo Leo contracts"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
env_logger = "0.11"
log = "0.4"
rand = "0.8"
colored = "2"
toml = "0.8"
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors"] }
uuid = { version = "1", features = ["v4"] }
tokio-stream = "0.1"

[dev-dependencies]
pretty_assertions = "1"