name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "leo-zap-wasm -> target"
          cache-all-crates: true

      - name: Install wasm-pack (pre-built binary)
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Build WASM (skip wasm-opt for speed)
        run: wasm-pack build --target web --no-opt leo-zap-wasm

      - name: Prepare deploy dir
        run: |
          mkdir -p deploy
          cp web/* deploy/
          cp leo-zap-wasm/pkg/*.js leo-zap-wasm/pkg/*.wasm deploy/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy/

  deploy:
    needs: build-wasm
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
